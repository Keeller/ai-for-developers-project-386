openapi: 3.0.0
info:
  title: Calendar Booking API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Return the current API health status.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - calendar-api
      additionalProperties:
        not: {}
      description: The API process is ready to receive requests.
servers:
  - url: http://127.0.0.1:3000
    description: Local development
    variables: {}
