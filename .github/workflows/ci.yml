name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

      - name: Generate advisory quality reports
        if: always()
        run: npm run report

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag calendar-booking:ci .

      - name: Start container and smoke-test application
        run: |
          docker run --detach \
            --name calendar-booking-ci \
            --publish 127.0.0.1:3000:3000 \
            calendar-booking:ci

          for attempt in {1..30}; do
            health="$(curl --fail --silent http://127.0.0.1:3000/api/health || true)"

            if [ "$health" = '{"status":"ok","service":"calendar-api"}' ]; then
              curl --fail --silent http://127.0.0.1:3000/ \
                | grep --fixed-strings '<div id="root"></div>'
              exit 0
            fi

            sleep 1
          done

          docker logs calendar-booking-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force calendar-booking-ci || true
